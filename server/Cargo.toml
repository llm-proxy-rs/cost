[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
common = { path = "../common" }
db = { path = "../db" }
myerrors = { path = "../myerrors" }
myhandlers = { path = "../myhandlers" }
templates = { path = "../templates" }
axum = "0.8.9"
tokio = { version = "1.52.3", features = ["full"] }
leptos = { version = "0.8.19", features = ["ssr"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "tls-rustls"] }
chrono = "0.4.45"
serde = { version = "1.0.228", features = ["derive"] }
clap = { version = "4.6.1", features = ["derive"] }
anyhow = "1.0.102"
env_logger = "0.11.10"
log = "0.4.32"
uuid = { version = "1.23.3", features = ["v4"] }
async-trait = "0.1.89"
config = "0.15.23"
time = "0.3.47"
tower-sessions = "0.15.0"
tower-sessions-sqlx-store = { git = "https://github.com/llm-proxy-rs/tower-sessions-stores.git", version = "0.15.0", features = ["postgres"] }

[features]
admin = []

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.3"
